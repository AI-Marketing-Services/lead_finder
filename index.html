<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VP Lead Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c6aff;
    --accent2: #ff6a9b;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Header */
  .header {
    margin-bottom: 48px;
  }
  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .header-sub {
    color: var(--muted);
    font-size: 13px;
  }

  /* Search panel */
  .search-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .search-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .search-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .search-field {
    flex: 1;
    min-width: 240px;
  }
  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type="text"] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.12);
  }
  input[type="text"]::placeholder { color: var(--muted); }

  .filter-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .filter-field {
    display: flex;
    flex-direction: column;
    min-width: 120px;
  }
  select {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--accent); }
  select option { background: var(--card); }

  .range-field {
    display: flex;
    flex-direction: column;
    min-width: 180px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    margin-top: 4px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(124,106,255,0.2);
  }
  .range-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .range-val {
    color: var(--accent);
  }

  .btn {
    background: linear-gradient(135deg, var(--accent), #9b8aff);
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Status bar */
  .status-bar {
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
    min-height: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-bar.loading { color: var(--accent); }
  .status-bar.error { color: var(--red); }
  .status-bar.success { color: var(--green); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results header */
  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .results-count {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .results-count span {
    color: var(--accent);
  }
  .sort-info {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* Lead cards */
  .leads-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .lead-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: 40px 1fr auto auto;
    gap: 16px;
    align-items: center;
    transition: border-color 0.2s, transform 0.15s;
    animation: fadeIn 0.3s ease both;
  }
  .lead-card:hover {
    border-color: var(--accent);
    transform: translateX(3px);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .rank {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--border);
    text-align: center;
    line-height: 1;
  }
  .lead-card:nth-child(1) .rank { color: #ffd700; }
  .lead-card:nth-child(2) .rank { color: #c0c0c0; }
  .lead-card:nth-child(3) .rank { color: #cd7f32; }

  .lead-info {
    min-width: 0;
  }
  .lead-name {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lead-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .lead-meta span { display: flex; align-items: center; gap: 4px; }

  .lead-status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 500;
    border: 1px solid;
  }

  .lead-dist {
    text-align: right;
    white-space: nowrap;
  }
  .dist-miles {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .dist-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .dist-approx {
    font-size: 10px;
    color: var(--yellow);
  }

  .lead-link {
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .lead-link:hover { opacity: 1; text-decoration: underline; }

  /* Status colors */
  .s-contract { color: var(--green); border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.06); }
  .s-followup { color: var(--blue); border-color: rgba(96,165,250,0.3); background: rgba(96,165,250,0.06); }
  .s-callbooked { color: var(--accent); border-color: rgba(124,106,255,0.3); background: rgba(124,106,255,0.06); }
  .s-new { color: #34d399; border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.06); }
  .s-reschedule { color: var(--yellow); border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.06); }
  .s-ltfu { color: #fb923c; border-color: rgba(251,146,60,0.3); background: rgba(251,146,60,0.06); }
  .s-noshow { color: var(--red); border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.06); }
  .s-nonresponsive { color: var(--muted); border-color: rgba(107,107,138,0.3); background: rgba(107,107,138,0.06); }
  .s-other { color: var(--muted); border-color: rgba(107,107,138,0.2); background: rgba(107,107,138,0.04); }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; }

  .pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .page-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .page-btn:hover, .page-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,106,255,0.08);
  }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  @media (max-width: 600px) {
    .lead-card { grid-template-columns: 32px 1fr; grid-template-rows: auto auto; }
    .lead-dist { grid-column: 2; }
    .lead-status { grid-column: 1 / -1; justify-self: start; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="header-eyebrow">VendingPreneur</div>
    <h1>Lead Finder</h1>
    <div class="header-sub">2,560 leads · sorted by distance + status score</div>
  </div>

  <div class="search-panel">
    <div class="search-row">
      <div class="search-field">
        <label for="locationInput">Search Location</label>
        <input type="text" id="locationInput" placeholder="City, State  /  ZIP  /  Full Address" />
      </div>
      <button class="btn" id="searchBtn" onclick="runSearch()">Find Leads</button>
    </div>
    <div class="filter-row">
      <div class="filter-field">
        <label for="statusFilter">Status Filter</label>
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">All Statuses</option>
          <option value="📄 Contract Sent">📄 Contract Sent</option>
          <option value="📞 Follow Up">📞 Follow Up</option>
          <option value="☎️ Call Booked">☎️ Call Booked</option>
          <option value="🆕 New">🆕 New</option>
          <option value="🕛 Reschedule">🕛 Reschedule</option>
          <option value="🗓️ Long Term Follow Up">🗓️ Long Term Follow Up</option>
          <option value="👻 No Show">👻 No Show</option>
          <option value="💤 Non-responsive">💤 Non-responsive</option>
        </select>
      </div>
      <div class="range-field">
        <div class="range-label">Max Distance: <span class="range-val" id="distVal">50</span> mi</div>
        <input type="range" id="distFilter" min="1" max="100" value="50" step="1" oninput="document.getElementById('distVal').textContent=this.value; applyFilters()">
      </div>
      <div class="filter-field">
        <label for="showUnknown" style="cursor:pointer;display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="showUnknown" onchange="currentPage=1; applyFilters()" style="width:16px;height:16px;cursor:pointer;">
          Show unknown distance (?)
        </label>
      </div>
      <div class="filter-field">
        <label for="perPage">Per Page</label>
        <select id="perPage" onchange="currentPage=1; renderResults()">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>
    <div class="status-bar" id="statusBar">Enter a location to find nearby leads.</div>
  </div>

  <div id="resultsSection" style="display:none">
    <div class="results-header">
      <div class="results-count">Showing <span id="countDisplay">0</span> leads</div>
      <div class="sort-info">60% distance · 40% status score</div>
    </div>
    <div class="leads-grid" id="leadsGrid"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="icon">📍</div>
    <p>Search a location above to discover nearby leads</p>
  </div>
</div>

const ALL_LEADS = LEADS.concat(CA_LEADS);


const STATUS_ORDER = {
  '📄 Contract Sent': 0,
  '📞 Follow Up': 1,
  '☎️ Call Booked': 2,
  '🆕 New': 3,
  '🕛 Reschedule': 4,
  '🗓️ Long Term Follow Up': 5,
  '👻 No Show': 6,
  '💤 Non-responsive': 7
};

const STATUS_CLASS = {
  '📄 Contract Sent': 's-contract',
  '📞 Follow Up': 's-followup',
  '☎️ Call Booked': 's-callbooked',
  '🆕 New': 's-new',
  '🕛 Reschedule': 's-reschedule',
  '🗓️ Long Term Follow Up': 's-ltfu',
  '👻 No Show': 's-noshow',
  '💤 Non-responsive': 's-nonresponsive'
};

const MAX_STATUS = 8;
let scoredLeads = [];
let filteredLeads = [];
let currentPage = 1;
let searchLat = null, searchLng = null;

function haversine(lat1, lng1, lat2, lng2) {
  const R = 3958.8;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function geocode(query) {
  // Detect if query looks Canadian (contains province abbreviation or Canadian postal code)
  const canadianProvinces = /\b(AB|BC|MB|NB|NL|NS|NT|NU|ON|PE|QC|SK|YT)\b/i;
  const canadianPostal = /\b[A-Za-z]\d[A-Za-z](\s*\d[A-Za-z]\d)?\b/;
  const isCanadian = canadianProvinces.test(query) || canadianPostal.test(query);

  // For Canadian queries: skip Census (US-only), go straight to Nominatim with CA
  if (!isCanadian) {
    try {
      const url = `https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?address=${encodeURIComponent(query)}&benchmark=Public_AR_Current&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      const matches = data?.result?.addressMatches;
      if (matches && matches.length > 0) {
        const c = matches[0].coordinates;
        return { lat: c.y, lng: c.x, source: 'census' };
      }
    } catch(e) {}
  }

  // Nominatim: restrict to CA for Canadian queries, US for others
  try {
    const cc = isCanadian ? 'ca' : 'us';
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&countrycodes=${cc}`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (data && data.length > 0) {
      return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), source: 'nominatim' };
    }
  } catch(e) {}

  // If Canadian query failed with CA restriction, try without restriction
  if (isCanadian) {
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=3`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
      const data = await res.json();
      // Pick the Canadian result
      const ca = data?.find(r => r.display_name && /Canada/.test(r.display_name));
      const hit = ca || (data && data[0]);
      if (hit) return { lat: parseFloat(hit.lat), lng: parseFloat(hit.lon), source: 'nominatim' };
    } catch(e) {}
  }

  // Last fallback: zip-only lookup (US)
  const zipMatch = query.match(/\b(\d{5})\b/);
  if (zipMatch && ZIP_COORDS[zipMatch[1]]) {
    const c = ZIP_COORDS[zipMatch[1]];
    return { lat: c.lat, lng: c.lng, source: 'zip' };
  }

  // Canadian FSA fallback
  const fsaMatch = query.match(/\b([A-Za-z]\d[A-Za-z])\b/);
  if (fsaMatch && CA_FSA_COORDS[fsaMatch[1].toUpperCase()]) {
    const c = CA_FSA_COORDS[fsaMatch[1].toUpperCase()];
    return { lat: c[0], lng: c[1], source: 'fsa' };
  }

  return null;
}

function setStatus(msg, type='') {
  const el = document.getElementById('statusBar');
  el.className = 'status-bar ' + type;
  el.innerHTML = type === 'loading' ? `<span class="spinner"></span> ${msg}` : msg;
}

async function runSearch() {
  const query = document.getElementById('locationInput').value.trim();
  if (!query) { setStatus('Please enter a location.', 'error'); return; }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  setStatus('Geocoding location...', 'loading');

  const geo = await geocode(query);
  btn.disabled = false;

  if (!geo) {
    setStatus('Could not find that location. Try a zip code or "City, State".', 'error');
    return;
  }

  searchLat = geo.lat;
  searchLng = geo.lng;
  setStatus(`Found: ${geo.lat.toFixed(4)}, ${geo.lng.toFixed(4)} · scoring ${ALL_LEADS.length} leads...`, 'loading');

  // Score all leads
  const maxDist = getMaxPossibleDist();
  scoredLeads = ALL_LEADS.map(lead => {
    const coords = ZIP_COORDS[lead.zip] || (CA_FSA_COORDS[lead.zip] ? {lat: CA_FSA_COORDS[lead.zip][0], lng: CA_FSA_COORDS[lead.zip][1]} : null);
    let dist = null, approx = false;
    if (coords) {
      dist = haversine(searchLat, searchLng, coords.lat, coords.lng);
    } else {
      // Zip prefix fallback
      const prefix = lead.zip.substring(0, 3);
      const fallback = Object.entries(ZIP_COORDS).find(([z]) => z.startsWith(prefix));
      if (fallback) {
        dist = haversine(searchLat, searchLng, fallback[1].lat, fallback[1].lng);
        approx = true;
      }
    }
    const statusRank = STATUS_ORDER[lead.status] ?? MAX_STATUS;
    const distScore = dist !== null ? (1 - Math.min(dist, maxDist) / maxDist) : 0;
    const statusScore = 1 - (statusRank / (MAX_STATUS + 1));
    const combined = 0.6 * distScore + 0.4 * statusScore;
    return { ...lead, dist, approx, statusRank, combined };
  }).sort((a, b) => b.combined - a.combined);

  currentPage = 1;
  applyFilters();
  setStatus(`Geocoded via ${geo.source}. Showing results below.`, 'success');
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('resultsSection').style.display = 'block';
}

function getMaxPossibleDist() {
  return 3000; // continental US diagonal ~2800mi
}

function applyFilters() {
  if (!scoredLeads.length) return;
  const statusF = document.getElementById('statusFilter').value;
  const maxDist = parseFloat(document.getElementById('distFilter').value);
  const showUnknown = document.getElementById('showUnknown').checked;
  filteredLeads = scoredLeads.filter(l => {
    if (statusF && l.status !== statusF) return false;
    if (l.dist === null && !showUnknown) return false;
    if (l.dist !== null && l.dist > maxDist) return false;
    return true;
  });
  currentPage = 1;
  renderResults();
}

function renderResults() {
  const perPage = parseInt(document.getElementById('perPage').value);
  const total = filteredLeads.length;
  const totalPages = Math.ceil(total / perPage);
  currentPage = Math.min(currentPage, totalPages || 1);

  document.getElementById('countDisplay').textContent = total.toLocaleString();

  const start = (currentPage - 1) * perPage;
  const page = filteredLeads.slice(start, start + perPage);

  const grid = document.getElementById('leadsGrid');
  grid.innerHTML = page.map((lead, i) => {
    const rank = start + i + 1;
    const distText = lead.dist !== null ? lead.dist.toFixed(1) : '?';
    const approxMark = lead.approx ? '<div class="dist-approx">~approx</div>' : '';
    const statusCls = STATUS_CLASS[lead.status] || 's-other';
    const locationInfo = ZIP_COORDS[lead.zip]
      ? `${ZIP_COORDS[lead.zip].city}, ${ZIP_COORDS[lead.zip].state} ${lead.zip}`
      : CA_FSA_COORDS[lead.zip]
      ? `Canada (${lead.zip})`
      : lead.zip;
    const phone = lead.primary_phone ? `<span>📞 ${lead.primary_phone}</span>` : '';
    const email = lead.primary_email ? `<span>✉ ${lead.primary_email}</span>` : '';
    const closeLink = lead.url ? `<a href="${lead.url}" target="_blank" class="lead-link">Open in Close ↗</a>` : '';

    return `<div class="lead-card" style="animation-delay:${(i % 50) * 15}ms">
      <div class="rank">${rank}</div>
      <div class="lead-info">
        <div class="lead-name">${escHtml(lead.name || 'Unknown')}</div>
        <div class="lead-meta">
          <span>📍 ${escHtml(locationInfo)}</span>
          ${phone}${email}
          ${closeLink}
        </div>
      </div>
      <div class="lead-status ${statusCls}">${escHtml(lead.status || 'Unknown')}</div>
      <div class="lead-dist">
        <div class="dist-miles">${distText}</div>
        <div class="dist-label">miles</div>
        ${approxMark}
      </div>
    </div>`;
  }).join('');

  // Pagination
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let btns = '';
  btns += `<button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled':''}>← Prev</button>`;
  const range = getPageRange(currentPage, totalPages);
  range.forEach(p => {
    if (p === '...') { btns += `<span class="page-btn" style="cursor:default">…</span>`; }
    else { btns += `<button class="page-btn ${p===currentPage?'active':''}" onclick="changePage(${p})">${p}</button>`; }
  });
  btns += `<button class="page-btn" onclick="changePage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next →</button>`;
  pag.innerHTML = btns;
}

function changePage(p) {
  currentPage = p;
  renderResults();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getPageRange(cur, total) {
  if (total <= 7) return Array.from({length: total}, (_,i) => i+1);
  const pages = [];
  pages.push(1);
  if (cur > 3) pages.push('...');
  for (let i = Math.max(2, cur-1); i <= Math.min(total-1, cur+1); i++) pages.push(i);
  if (cur < total - 2) pages.push('...');
  pages.push(total);
  return pages;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Enter key support
document.getElementById('locationInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});
